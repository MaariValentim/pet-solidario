name: Testes e cobertura

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes e verificar cobertura
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Exibir cobertura de linhas
        run: node .github/scripts/print-coverage.js

      - name: Salvar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  interface:
    name: Interface e acessibilidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências de interface
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Verificar interface, teclado e acessibilidade
        run: npm run test:e2e

      - name: Salvar capturas de tela
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-interface
          path: artifacts/*.png
          if-no-files-found: warn
