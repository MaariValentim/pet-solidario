services:
  db:
    image: postgres:17-alpine
    container_name: pet-solidario-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pet_solidario}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-pet_solidario}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
